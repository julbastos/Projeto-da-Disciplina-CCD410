<!doctype html>
<html lang="pt-br">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>biblioteca plural</title><link rel="stylesheet" href="/static/style.css"><script src="/static/app.js" defer></script></head>
<body>
<aside><a class="brand" href="/">▥ <span>biblioteca<br><b>plural</b></span></a><nav aria-label="navegação principal"><button data-tab="acervo" class="active">▤ &nbsp; acervo</button><button data-tab="usuarios">♧ &nbsp; leitores</button><button data-tab="emprestimos">⇄ &nbsp; empréstimos</button></nav><footer>projeto da disciplina ccd410</footer></aside>
<main><header><span>biblioteca / <span id="breadcrumb">acervo</span></span></header><section class="intro"><h1 id="title">livros</h1></section>
<div id="notice" role="status" hidden></div>
<section id="acervo" class="panel"><div class="toolbar"><h2>livros cadastrados <span id="book-count"></span></h2><input id="busca" aria-label="buscar no acervo" placeholder="buscar título, autor ou gênero..."><button class="primary" data-dialog="livro-dialog">+ novo livro</button></div><div id="books" class="books"></div></section>
<section id="usuarios" class="panel" hidden><div class="toolbar"><h2>leitores cadastrados</h2><button class="primary" data-dialog="usuario-dialog">+ novo leitor</button></div><div id="readers" class="table-wrap"></div></section>
<section id="emprestimos" class="panel" hidden><div class="toolbar"><h2>empréstimos registrados</h2><button id="sync">atualizar histórico</button><button class="primary" data-dialog="emprestimo-dialog">+ emprestar livro</button></div><div id="loans" class="table-wrap"></div></section>
</main>
<dialog id="livro-dialog"><form id="livro-form"><div class="dialog-heading"><h2>cadastrar livro</h2><button type="button" data-close aria-label="fechar">×</button></div><label>título<input name="titulo" required maxlength="250"></label><label>autores <small>separe com vírgulas</small><input name="autores" required></label><label>gêneros <small>separe com vírgulas</small><input name="generos" required></label><div class="form-row"><label>isbn<input name="isbn" maxlength="30"></label><label>ano<input name="ano" type="number" min="1" max="2100"></label></div><label>exemplares disponíveis<input name="quantidade" type="number" min="0" max="100000" value="1" required></label><p class="form-error" role="alert"></p><button class="primary">cadastrar livro</button></form></dialog>
<dialog id="usuario-dialog"><form id="usuario-form"><div class="dialog-heading"><h2>novo leitor</h2><button type="button" data-close aria-label="fechar">×</button></div><label>nome<input name="nome" minlength="2" maxlength="120" required></label><label>email<input name="email" type="email" maxlength="180" required></label><label>telefone<input name="telefone" maxlength="30" type="tel"></label><label>matrícula<input name="matricula" maxlength="40"></label><p class="form-error" role="alert"></p><button class="primary">cadastrar leitor</button></form></dialog>
<dialog id="emprestimo-dialog"><form id="emprestimo-form"><div class="dialog-heading"><h2>registrar empréstimo</h2><button type="button" data-close aria-label="fechar">×</button></div><label>leitor<select name="usuario_id" id="loan-reader" required></select></label><label>livro disponível<select name="livro_id" id="loan-book" required></select></label><p class="form-error" role="alert"></p><button class="primary">registrar empréstimo</button></form></dialog>
<dialog id="estoque-dialog"><form id="estoque-form"><div class="dialog-heading"><h2>ajustar estoque</h2><button type="button" data-close aria-label="fechar">×</button></div><input name="livro_id" type="hidden"><label>exemplares disponíveis<input name="quantidade" type="number" min="0" max="100000" required></label><p class="hint">informe os exemplares que estão na biblioteca, sem contar os emprestados.</p><p class="form-error" role="alert"></p><button class="primary">salvar estoque</button></form></dialog>
</body></html>
