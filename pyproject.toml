[project]
name = "projeto-da-disciplina-ccd410"
version = "0.1.0"
description = "biblioteca com persistência poliglota"
readme = "README.md"
authors = [
    { name = "Júlia Bastos", email = "juliabtsbrt2005@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "cassandra-driver>=3.29",
    "fastapi>=0.162.2",
    "psycopg[binary]>=3.1",
    "pydantic-settings>=2.16.2",
    "pymongo>=4.6",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.1.8",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = ["httpx>=0.27"]

[project.scripts]
projeto-da-disciplina-ccd410 = "projeto_da_disciplina_ccd410:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.vercel]
entrypoint = "index:app"
