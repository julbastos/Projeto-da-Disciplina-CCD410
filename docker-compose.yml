services:

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: biblioteca
      POSTGRES_PASSWORD: biblioteca
      POSTGRES_DB: biblioteca
    ports:
      - "5432:5432"
    volumes:
      - ./db/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biblioteca -d biblioteca"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------- MongoDB: replica set de 3 nós (writeConcern majority) ----------
  mongo1:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongod", "--version"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo2:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      test: ["CMD", "mongod", "--version"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo3:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      test: ["CMD", "mongod", "--version"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo-init:
    image: python:3.12-slim
    depends_on:
      mongo1:
        condition: service_healthy
      mongo2:
        condition: service_healthy
      mongo3:
        condition: service_healthy
    volumes:
      - ./db/mongo:/init:ro
    command: sh -c "pip install -q pymongo && python /init/mongo_init.py"
    restart: on-failure

  # ---------- Cassandra: cluster de 3 nós (RF=3, consistência ONE nas escritas) ----------
  cass1:
    image: cassandra:4.1
    environment:
      CASSANDRA_CLUSTER_NAME: biblioteca
      CASSANDRA_SEEDS: cass1
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    ports:
      - "9042:9042"
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  cass2:
    image: cassandra:4.1
    environment:
      CASSANDRA_CLUSTER_NAME: biblioteca
      CASSANDRA_SEEDS: cass1
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    depends_on:
      cass1:
        condition: service_healthy

  cass3:
    image: cassandra:4.1
    environment:
      CASSANDRA_CLUSTER_NAME: biblioteca
      CASSANDRA_SEEDS: cass1
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    depends_on:
      cass1:
        condition: service_healthy

  cassandra-init:
    image: cassandra:4.1
    depends_on:
      cass1:
        condition: service_healthy
      cass2:
        condition: service_started
      cass3:
        condition: service_started
    volumes:
      - ./db/cassandra:/init:ro
    command: sh -c "sleep 30 && cqlsh cass1 -f /init/init.cql"
    restart: on-failure

  # Serviços de aplicação (API FastAPI e frontend) serão adicionados nas próximas etapas.
